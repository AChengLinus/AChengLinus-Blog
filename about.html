    about_footer: 'The beginning of everything, the continuation of dreams',
    page_title: 'Docs - AChengLinux',
    lang_btn: '中文'
  }
};

var currentLang = localStorage.getItem('lang') || 'zh';

function applyLang(lang) {
  currentLang = lang;
  localStorage.setItem('lang', lang);
  var dict = Lang[lang];
  document.querySelectorAll('[data-i18n]').forEach(function(el) {
    var key = el.getAttribute('data-i18n');
    if (dict[key] !== undefined) {
      el.textContent = dict[key];
    }
  });
  var toggle = document.getElementById('langToggle2') || document.getElementById('langToggle');
  if (toggle) toggle.textContent = dict.lang_btn;
  document.documentElement.lang = lang;
}

function toggleLang() {
  applyLang(currentLang === 'zh' ? 'en' : 'zh');
  if (typeof reloadRoute === 'function') reloadRoute();
}

applyLang(currentLang);
</script>

<script>
// ===== 文章内容翻译 =====
var routeContent = {
  zh: {
    qa_intro: '<big>AChengLinux|Blog 于2024年3月8号正式创立</big>',
    loading: '文档加载中。',
    tos: '<p><big>与我一起游玩</big><p>1.我的世界Minecraft服务器生存，bb小镇QQ群：686199998</p>2.雾锁玩国,雾锁王国官方QQ④群957132178</p>',
    about: '<p><big>阿成（AChengLinux）</big><p>01年出生的普普通通的人，在社会受气，受打击的地方苟且存活，这是他在期间创造个人围脖，本站由AChengLinux独立运营</p>技术成员没有，从业工作时间超过 1年，具有贫穷的研发和运维经验。<br></p>'
  },
  en: {
    qa_intro: '<big>AChengLinux|Blog was founded on March 8, 2024</big>',
    loading: 'Loading document...',
    tos: '<p><big>Play With Me</big><p>1. Minecraft survival server, bb town QQ group: 686199998</p>2. Enshrouded, official QQ Group ④: 957132178</p>',
    about: '<p><big>Acheng (AChengLinux)</big><p>An ordinary person born in 2001, surviving where society pushes and challenges. This blog was created during that journey, independently operated by AChengLinux.</p>No technical team, over 1 year of work experience, with humble development and operations expertise.<br></p>'
  }
};

var currentView = 'qa';

function getLang() { return localStorage.getItem('lang') || 'zh'; }

function reloadRoute() {
  var rc = routeContent[getLang()];
  var activeNav = document.querySelector('.nav-box a.active');
  if (activeNav) 标题.innerHTML = activeNav.innerHTML;
  switch (currentView) {
    case 'qa':
      M.innerHTML = rc.qa_intro;
      _.x('static/md/qa.md?6', function(r){
        M.innerHTML = rc.qa_intro + C.makeHtml(r);
      });
      break;
    case '??':
      M.innerHTML = '<p class="text-banner">' + rc.loading + '</p>';
      _.x('static/md/api.md?7', function(r){
        M.innerHTML = r;
      });
      break;
    case 'tc':
      M.innerHTML = '<p class="text-banner">' + rc.loading + '</p>';
      _.x('static/md/tc.md?5', function(r){
        M.innerHTML = C.makeHtml(r);
      });
      break;
    case 'tos':
      M.innerHTML = rc.tos;
      break;
    case 'about':
      M.innerHTML = rc.about;
      break;
  }
}

var C = new Markdown.Converter();

Q.reg('pop', function(view) {
  if (!view) return;
  currentView = view;
  var nav = document.querySelector('.nav-box a[href*="' + view + '"]');
  if (!nav) return;
  var lastNav = document.querySelector('.nav-box a.active');
  if (lastNav) lastNav.classList.remove('active');
  nav.classList.add('active');
  标题.innerHTML = nav.innerHTML;
  reloadRoute();
}).reg('qa', function(){
  currentView = 'qa';
  reloadRoute();
}).reg('??', function(){
  currentView = '??';
  reloadRoute();
}).reg('tc', function(){
  currentView = 'tc';
  reloadRoute();
}).reg('tos', function(){
  currentView = 'tos';
  reloadRoute();
}).reg('about', function(){
  currentView = 'about';
  reloadRoute();
}).init({
  index: 'qa'
});
